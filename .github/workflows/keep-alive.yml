name: Keep Backend Alive

on:
  schedule:
    # Every 10 minutes — comfortably under Render's 15-minute free-tier
    # sleep threshold. GitHub's cron scheduler isn't millisecond-precise
    # under load, so we don't cut it close to 15.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          # /health does a real SELECT 1 against Postgres (see app/main.py),
          # so this single ping keeps both the Render web service AND the
          # Neon database compute from going idle — not just the API process.
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_HEALTH_URL }}")
          echo "Health check responded: $response"
          if [ "$response" != "200" ]; then
            echo "::warning::Backend health check returned $response instead of 200"
          fi
